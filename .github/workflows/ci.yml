name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            bubblewrap \
            cmake \
            curl \
            git \
            libjson-c-dev \
            libfido2-dev \
            libqrencode-dev \
            libssl-dev \
            libuv1-dev \
            libwebsockets-dev \
            iproute2 \
            nodejs \
            pkg-config \
            python3 \
            zlib1g-dev
      - name: Build and test
        run: make check
