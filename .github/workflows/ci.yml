name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            libjson-c-dev \
            libssl-dev \
            libuv1-dev \
            libwebsockets-dev \
            python3 \
            zlib1g-dev
      - name: Build and test
        run: make check
