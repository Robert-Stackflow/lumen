[program:lumen-web]
command=/opt/lumen-terminal/bin/lumen-ttyd --port 3012 --interface lo --writable --url-arg --check-origin --security-config /etc/lumen-terminal/security.conf --max-clients 16 --ping-interval 15 --index /opt/lumen-terminal/dist/index.html /opt/lumen-terminal/bin/lumen-pty
directory=/var/lib/lumen-terminal
user=lumen-web
priority=20
autostart=true
autorestart=unexpected
startsecs=2
startretries=5
stopsignal=TERM
stopwaitsecs=10
stopasgroup=true
killasgroup=true
environment=HOME="/var/lib/lumen-terminal",LANG="C.UTF-8",TERM="xterm-256color",LUMEN_PTY_SOCKET="/run/lumen-terminal/pty.sock",LUMEN_ROOT_PTY_SOCKET="/run/lumen-root-terminal/pty.sock",LUMEN_PTY_WORKER_DIR="/var/lib/lumen-pty/sessions",LUMEN_ROOT_PTY_WORKER_DIR="/var/lib/lumen-root-pty/sessions",LUMEN_LOGIN_TEMPLATE="/opt/lumen-terminal/dist/login.html"
stdout_logfile=/var/log/supervisor/lumen-web.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
redirect_stderr=true
