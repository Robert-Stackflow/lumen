[program:lumen-web]
command=/opt/lumen-terminal/bin/lumen-ttyd --uid 1000 --gid 1001 --port 3012 --interface lo --writable --url-arg --check-origin --security-config /etc/lumen-terminal/security.conf --max-clients 16 --ping-interval 15 --index /opt/lumen-terminal/dist/index.html /opt/lumen-terminal/bin/lumen-pty
directory=/home/ubuntu
user=root
priority=20
autostart=true
autorestart=unexpected
startsecs=2
startretries=5
stopsignal=TERM
stopwaitsecs=10
stopasgroup=true
killasgroup=true
environment=HOME="/home/ubuntu",LANG="C.UTF-8",TERM="xterm-256color",LUMEN_PTY_SOCKET="/home/ubuntu/.local/state/lumen-terminal/pty.sock"
stdout_logfile=/var/log/supervisor/lumen-web.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
redirect_stderr=true
