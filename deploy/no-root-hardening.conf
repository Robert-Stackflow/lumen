# Optional systemd drop-in for deployments where the web shell must never
# elevate through sudo/setuid. Install as:
# /etc/systemd/system/lumen-terminal.service.d/no-root.conf
[Service]
NoNewPrivileges=true
CapabilityBoundingSet=CAP_SETUID CAP_SETGID
AmbientCapabilities=
LockPersonality=true
PrivateTmp=true
ProtectClock=true
ProtectControlGroups=true
ProtectHostname=true
ProtectKernelLogs=true
ProtectKernelModules=true
ProtectKernelTunables=true
ProtectSystem=full
ReadOnlyPaths=/etc/lumen-terminal/security.conf
RestrictRealtime=true
RestrictSUIDSGID=true
SystemCallArchitectures=native
